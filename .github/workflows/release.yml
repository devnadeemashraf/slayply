name: Release

# Pushing a tag such as v1.0.0 builds the extension against the live relay and publishes it as a
# GitHub release. The asset name is fixed so the site's download link never changes.
# The build job runs install scripts and tests with a read-only token; only the publish job can write.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  WXT_RELAY_URL: https://slayply-relay.onrender.com

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag must match the extension version and be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./apps/extension/package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "Tag $TAG does not match the extension version $version" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $TAG is not on main" >&2
            exit 1
          }

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Never publish something that fails the checks.
      - run: pnpm run check

      # `wxt zip` refuses to run without an https WXT_RELAY_URL.
      - run: pnpm --filter @slayply/extension zip

      - name: Name the asset and write its checksum
        run: |
          cp apps/extension/.output/*-chrome.zip slayply-extension.zip
          sha256sum slayply-extension.zip | tee slayply-extension.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            slayply-extension.zip
            slayply-extension.zip.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/RELEASE_NOTES_${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" slayply-extension.zip slayply-extension.zip.sha256 --title "Slayply ${TAG}" --notes-file "$notes"
          else
            gh release create "$TAG" slayply-extension.zip slayply-extension.zip.sha256 --title "Slayply ${TAG}" --generate-notes
          fi
