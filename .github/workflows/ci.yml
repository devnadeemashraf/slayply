name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # doctor, handoff, format, lint, test, typecheck
      - run: pnpm run check

  # Builds the extension, fails over 3.5 MB (SPEC §5) and loads it in Chromium once.
  extension-smoke:
    name: extension-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@slayply/extension
      - run: pnpm run budget
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm run smoke
      - run: pnpm exec turbo run build --filter=@slayply/site
      - run: pnpm run smoke:site
