name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Test Skeleton
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Doctor
        run: pnpm run doctor

      - name: Run Handoff Guard
        run: pnpm run handoff:check

      - name: Format Check
        run: pnpm run fmt:check

      - name: Lint Check
        run: pnpm run lint

      - name: Run Tests
        run: pnpm test

      - name: Full Check
        run: pnpm run check
